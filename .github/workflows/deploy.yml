name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # Sentinel pushes only this directory and triggers deploy via
      # repository_dispatch instead — prevents a double Deploy run.
      - 'public/data/**'
  repository_dispatch:
    types: [sentinel-data-update]

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deployment that is already in progress
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # npm ci runs third-party install scripts — keep this job read-only
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check
        run: npm run lint

      - name: 🏗️ Build Application
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: 📤 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: build

    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1