name: BLACKBOX Sentinel

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple Sentinel runs at the same time
concurrency:
  group: sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    name: Sync Portfolio Data
    runs-on: ubuntu-latest

    env:
      SENTINEL_GITHUB_USERNAME: ${{ vars.SENTINEL_GITHUB_USERNAME }}
      SENTINEL_HTB_USER_ID: ${{ vars.SENTINEL_HTB_USER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sentinel/requirements.txt

      - name: Restore Sentinel State
        uses: actions/cache/restore@v4
        with:
          path: sentinel/data/
          key: sentinel-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sentinel-state-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sentinel/requirements.txt

      - name: Run BLACKBOX Sentinel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
        run: |
          python sentinel/updater.py

      - name: Save Sentinel State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sentinel/data/
          key: sentinel-state-${{ runner.os }}-${{ github.run_id }}

      - name: Commit Updated Portfolio Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/

          if git diff --cached --quiet; then
            echo "✅ No portfolio updates detected."
          else
            git commit -m "🤖 BLACKBOX Sentinel Sync"
            git push
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo " BLACKBOX Sentinel finished"
          echo "======================================"
          echo " GitHub:   Synced"
          echo " HTB:      Synced"
          echo " JSON:     Updated if changes existed"
          echo "======================================"