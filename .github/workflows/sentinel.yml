name: BLACKBOX Sentinel

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple Sentinel runs at the same time
concurrency:
  group: sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    name: Sync Portfolio Data
    runs-on: ubuntu-latest

    env:
      SENTINEL_GITHUB_USERNAME: ${{ vars.SENTINEL_GITHUB_USERNAME }}
      SENTINEL_HTB_USER_ID: ${{ vars.SENTINEL_HTB_USER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sentinel/requirements.txt

      - name: Restore Sentinel State
        uses: actions/cache/restore@v4
        with:
          path: sentinel/data/
          key: sentinel-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sentinel-state-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sentinel/requirements.txt

      - name: Run BLACKBOX Sentinel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
        run: |
          python sentinel/updater.py

      - name: Save Sentinel State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sentinel/data/
          key: sentinel-state-${{ runner.os }}-${{ github.run_id }}

      - name: Commit Updated Portfolio Data
        id: commit
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Embed PAT directly in the remote URL so git push is unambiguously
          # PAT-authenticated regardless of how the credential helper resolves.
          git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git"

          git add public/data/

          if git diff --cached --quiet; then
            echo "✅ No portfolio updates detected."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 BLACKBOX Sentinel Sync"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"sentinel-data-update"}')
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "⚠️ Dispatch returned HTTP ${HTTP_STATUS} — Deploy may not trigger."
            exit 1
          fi
          echo "✅ Deploy workflow dispatched."

      - name: Workflow Summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo " BLACKBOX Sentinel finished"
          echo "======================================"
          echo " GitHub:   Synced"
          echo " HTB:      Synced"
          echo " JSON:     Updated if changes existed"
          echo "======================================"